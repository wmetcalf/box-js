name: test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # file: resource typing; m4 + cc: the @cc_on/@if rewrite, which the sandbox-escape
      # payloads must actually reach (test/sandbox-escape.js fails under CI without them).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends file m4 gcc
      - run: npm ci
      - run: npm test
